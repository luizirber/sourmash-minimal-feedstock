context:
  version: 4.9.4

package:
  name: sourmash-minimal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sourmash/sourmash-${{ version }}.tar.gz
  sha256: 28889d11041e398831875c7d17a367e3e5937b095d006752e45c7f2302f4626d

build:
  number: 2
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
    entry_points:
      - sourmash = sourmash.__main__:main
  dynamic_linking:
    missing_dso_allowlist:
      - if: osx
        then: /usr/lib/libresolv.9.dylib

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }} >=1.65.0
    - maturin
    - cargo-bundle-licenses
    - liblzma-devel

    # cross-compilation dependencies
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
        - crossenv
        - cffi

    - if: unix
      then:
        - libclang
        - clangdev

  host:
    - if: is_abi3
      then: python-abi3
    - python ${{ python_min }}.*
    - pip
    - maturin
    - toml
    - cffi

  run:
    - python >=${{ python_min }}
    - screed >=1.1.3
    - cffi >=1.17.1
    - deprecation >=2.0.6
    - cachetools >=4,<6
    - numpy
    - matplotlib-base
    - scipy
    - bitstring >=3.1.9,<5

tests:
  - python:
      imports:
        - sourmash
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
      pip_check: false
  - script:
      - sourmash --help
      - sourmash info

about:
  summary: Compute and compare MinHash signatures for DNA data sets.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/sourmash-bio/sourmash
  repository: https://github.com/sourmash-bio/sourmash
  documentation: https://sourmash.bio/

extra:
  recipe-maintainers:
    - luizirber
    - ctb
    - bluegenes
